body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#120E0C;font-family:'Silkscreen',monospace}
.scotch{display:inline-block;padding:10px 18px 9px;font-size:16px;line-height:1;color:#1F1D1A;text-decoration:none;transform:rotate(-1.5deg);background:linear-gradient(180deg,rgba(255,255,255,0.22) 0,rgba(255,255,255,0.22) 2px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) calc(100% - 3px),rgba(90,70,40,0.22) calc(100% - 3px)),repeating-linear-gradient(90deg,rgba(255,255,255,0.08) 0,rgba(255,255,255,0.08) 3px,rgba(110,90,50,0.06) 3px,rgba(110,90,50,0.06) 6px),rgba(231,219,182,0.97);clip-path:polygon(0 0,100% 0,calc(100% - 3px) 14%,100% 28%,calc(100% - 3px) 42%,100% 57%,calc(100% - 3px) 71%,100% 85%,calc(100% - 3px) 100%,0 100%,3px 86%,0 72%,3px 58%,0 43%,3px 29%,0 15%);background-color:#E1D5B1}
a.scotch{transform:rotate(1.2deg)}
a.scotch:focus-visible{outline:none;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
</style>
</head>
